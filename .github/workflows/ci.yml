name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: Pack and smoke-test the tarball
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/basitalisandhu-claude-mcp-allow-*.tgz
          npx claude-mcp-allow --version
          npx claude-mcp-allow --help | head -1

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pack, install into an empty folder, run the three quick start commands, compare with the README sample
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm pack
          awk '/^```text$/{f=1;next} f&&/^```$/{exit} f' README.md > "$RUNNER_TEMP/want.txt"
          mkdir -p "$RUNNER_TEMP/tool" "$RUNNER_TEMP/home" "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/tool"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/basitalisandhu-claude-mcp-allow-*.tgz
          bin="$RUNNER_TEMP/tool/node_modules/.bin/claude-mcp-allow"
          cd "$RUNNER_TEMP/project"
          # A project with one stdio server: the annotated fixture the README sample comes from.
          printf '{ "mcpServers": { "annotated": { "command": "node", "args": ["%s"] } } }\n' \
            "$GITHUB_WORKSPACE/tests/fixtures/annotated-server.mjs" > .mcp.json
          export HOME="$RUNNER_TEMP/home"
          "$bin" 2> report.txt > rules.json
          head -n "$(wc -l < "$RUNNER_TEMP/want.txt")" report.txt > got.txt
          diff "$RUNNER_TEMP/want.txt" got.txt
          "$bin" --diff --write
          "$bin" --check
          FIXTURE_DRIFT=flip "$bin" --check && exit 1 || test $? = 1

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and run it on an empty project
        run: |
          docker build --build-arg VERSION=ci -t claude-mcp-allow:ci .
          docker run --rm claude-mcp-allow:ci --help > help.txt && grep "^Usage" help.txt
          docker run --rm claude-mcp-allow:ci --version
          mkdir -p "$RUNNER_TEMP/empty"
          docker run --rm -v "$RUNNER_TEMP/empty:/work:ro" claude-mcp-allow:ci > out.json
          grep -q '"permissions"' out.json
